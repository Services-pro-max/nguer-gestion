<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="icon-192.png"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0b1f5e"><link rel="apple-touch-icon" href="icon-192.png"><title>Nguer Gestion</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f4fa;--card:#fff;--ink:#0d1630;--mut:#5a6482;--line:#dde2f0;--acc:#14337f;--on:#fff;--soft:#e6ecfb;--bad:#c0392b;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1020;--card:#121a30;--ink:#eef1fa;--mut:#9aa6c8;--line:#25305a;--acc:#f5b82e;--on:#0a1020;--soft:#1d2a52;--bad:#ff8a7a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a1020;--card:#121a30;--ink:#eef1fa;--mut:#9aa6c8;--line:#25305a;--acc:#f5b82e;--on:#0a1020;--soft:#1d2a52;--bad:#ff8a7a;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
main{max-width:640px;margin:0 auto;padding:16px 16px 110px}
h1{font-size:22px;margin:4px 0 2px;letter-spacing:-.02em}
h2{font-size:17px;margin:22px 0 10px}
.sub{color:var(--mut);font-size:14px;margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.k{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.k small{color:var(--mut);display:block;font-size:12px}
.k b{font-size:19px;font-weight:800}
.k.main{grid-column:1/-1;background:var(--acc);color:var(--on);border:0}
.k.main small{color:var(--on);opacity:.8}
.neg{color:var(--bad)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.row small{color:var(--mut);display:block}
.btn{border:0;background:var(--acc);color:var(--on);font-weight:700;border-radius:12px;padding:12px 16px;cursor:pointer;width:100%}
.btn.s{width:auto;padding:8px 12px;font-size:14px}
.btn.o{background:var(--soft);color:var(--acc)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;cursor:pointer;font-weight:600}
.chip.on{background:var(--acc);color:var(--on);border-color:var(--acc)}
input,select,textarea{width:100%;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--bg);margin-bottom:8px}
label{font-size:13px;color:var(--mut);display:block;margin-bottom:3px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.q{display:flex;align-items:center;gap:8px}
.q button{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:18px}
.bars{display:flex;align-items:flex-end;gap:6px;height:90px;margin-top:8px}
.bars div{flex:1;background:var(--acc);border-radius:5px 5px 0 0;min-height:3px;opacity:.85}
.bl{display:flex;gap:6px;font-size:11px;color:var(--mut)}.bl span{flex:1;text-align:center}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
nav button{flex:1;border:0;background:none;padding:12px 2px;font-size:12px;font-weight:600;color:var(--mut);cursor:pointer}
nav button.on{color:var(--acc)}
nav button span{display:block;font-size:19px}
#m{position:fixed;inset:0;background:rgba(5,12,10,.55);z-index:30;display:none;align-items:flex-end;justify-content:center}
#m.on{display:flex}
#m>div{background:var(--card);width:min(640px,100%);border-radius:18px 18px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));max-height:90%;overflow:auto}
.warn{font-size:12px;color:var(--mut);margin:6px 0}
.empty{color:var(--mut);text-align:center;padding:18px 0}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.rc{background:#fff;color:#111;font-family:Arial,Helvetica,sans-serif;font-size:12px;line-height:1.35;margin:0 auto}
.rc.t80{width:72mm;padding:3mm}.rc.t58{width:50mm;padding:2mm;font-size:10px}.rc.a4{width:186mm;padding:10mm;font-size:13px;min-height:250mm}
.rc img.lg{display:block;margin:0 auto 4px;max-height:60px;max-width:70%}
.rc .c{text-align:center}.rc h3{margin:2px 0;font-size:1.3em}
.rc hr{border:0;border-top:1px dashed #555;margin:6px 0}
.rc table{width:100%;border-collapse:collapse}
.rc th{text-align:left;border-bottom:1px solid #111;font-size:.9em;padding:3px 0}
.rc td{padding:3px 0;vertical-align:top}
.rc .r{text-align:right}
.rc .tot{display:flex;justify-content:space-between;gap:8px;padding:2px 0}
.rc .big{font-size:1.2em;font-weight:800;border-top:2px solid #111;border-bottom:2px solid #111;padding:4px 0;margin:4px 0}
.rc.a4 th{background:#14337f;color:#fff;padding:7px 8px}.rc.a4 td{padding:7px 8px;border-bottom:1px solid #ddd}.rc.a4 hr{border-top:1px solid #ccc}
.rc .sig{border:1px dashed #888;height:70px;margin-top:14px;font-size:11px;color:#666;padding:4px}
#pr{display:none}
#st{max-width:640px;margin:0 auto;padding:8px 16px 0;font-size:12px;color:var(--mut)}
@media print{body>*:not(#pr){display:none!important}#pr{display:block!important}body{background:#fff!important}.rc{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style>
</head>

<nav id="nav"></nav>
<div id="m"><div id="mc"></div></div>

function persist(puts,dels,qput,qdel){
  if(!DB){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){saveOk=false}return}

    var tx=DB.transaction(COLS.concat(["meta","queue"]),"readwrite");

    dels.forEach(function(x){tx.objectStore(x[0]).delete(x[1])});
    qdel.forEach(function(o){tx.objectStore("queue").delete(o)});
    qput.forEach(function(o){tx.objectStore("queue").put(o)});
    tx.objectStore("meta").put(metaDoc());
    tx.onabort=function(){saveOk=false;if(!locked)draw()};
  }catch(e){saveOk=false}
}
function seedSnap(){COLS.forEach(function(c){S[c].forEach(function(r){SNAP[c+":"+r.uid]=recKey(r)})})}
function legacyLoad(){var o=null;try{o=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(o&&Array.isArray(o.produits))S=o;DEV=DEV||uuid()}

function loadAll(){
  var tx=DB.transaction(COLS.concat(["meta","queue"]),"readonly"),R={};
  COLS.forEach(function(c){tx.objectStore(c).getAll().onsuccess=function(e){R[c]=e.target.result}});
  tx.objectStore("meta").get("meta").onsuccess=function(e){R.meta=e.target.result};
  tx.objectStore("queue").getAll().onsuccess=function(e){R.q=e.target.result};
  tx.oncomplete=function(){
    if(R.meta){
      var m=R.meta;DEV=m.dev||uuid();S={nid:m.nid||1,shop:m.shop,prof:m.prof,rf:m.rf,bk:m.bk,pinh:m.pinh,mig:m.mig};
      COLS.forEach(function(c){S[c]=(R[c]||[]).sort(function(a,b){return a.ca<b.ca?-1:a.ca>b.ca?1:0})});
      Q=(R.q||[]).sort(function(a,b){return a.ts<b.ts?-1:a.ts>b.ts?1:0});seedSnap();fin();
    }else migrate();
  };

function verify(old,cb){
  var tx=DB.transaction(COLS,"readonly"),R={};
  COLS.forEach(function(c){tx.objectStore(c).getAll().onsuccess=function(e){R[c]=e.target.result}});
  tx.oncomplete=function(){
    var s=function(a,f){return sum(a||[],f)};
    cb(COLS.every(function(c){return(R[c]||[]).length===old[c].length})&&s(R.ventes,function(v){return v.total})===s(old.ventes,function(v){return v.total})&&s(R.produits,function(p){return p.q})===s(old.produits,function(p){return p.q})&&s(R.depenses,function(d){return d.m})===s(old.depenses,function(d){return d.m})&&s(R.remb,function(r){return r.m})===s(old.remb,function(r){return r.m}));
  };
  tx.onerror=function(){cb(false)};
}
function migrate(){
  var old=null;try{old=JSON.parse(localStorage.getItem(KEY))}catch(e){}
  DEV=uuid();
  if(!old||!Array.isArray(old.produits)){S={produits:[],ventes:[],depenses:[],remb:[],mvts:[],nid:1};save();return fin()}
  var go=function(){
    var t0=Date.now()-1e6,i=0;
    COLS.forEach(function(c){old[c]=Array.isArray(old[c])?old[c]:[];old[c].forEach(function(r){if(!r.uid){r.uid=uuid();r.ca=new Date(t0+(i++)).toISOString()}})});
    old.nid=old.nid||1;S=old;save();
    verify(old,function(ok){
      if(ok){S.mig="ok";save();fin()}
      else{try{DB.close();indexedDB.deleteDatabase("nguer_gestion")}catch(e){}DB=null;SNAP={};Q=[];legacyLoad();fin();

    });
  };
  if(old.pin){mkPin(String(old.pin)).then(function(s){old.pinh=s;delete old.pin;go()})}else go();
}
function replaceAll(d){

  var mx=0;["produits","ventes","depenses","remb"].forEach(function(c){d[c].forEach(function(r){if(r.id>mx)mx=r.id})});

}
function pinH(p,salt){if(!(window.crypto&&crypto.subtle&&window.TextEncoder))return Promise.resolve("n"+p);return crypto.subtle.digest("SHA-256",new TextEncoder().encode(salt+":"+p)).then(function(b){return Array.from(new Uint8Array(b)).map(function(x){return("0"+x.toString(16)).slice(-2)}).join("")})}

  h+='<div class="card row"><b>Total</b><b style="font-size:20px">'+f(Math.max(0,cartTotal()-rem))+'</b></div><label>Remise accordée (F, facultatif)</label><input inputmode="numeric" value="'+(rem||"")+'" onchange="rem=num(this.value);draw()"><label>Mode de paiement</label><div class="chips">'+["Espèces","Wave","Orange Money","Crédit"].map(function(m){return '<button class="chip '+(m===mode?"on":"")+'" onclick="mode=\''+m+'\';draw()">'+m+'</button>'}).join("")+'</div>';
  h+='<label>Nom du client '+(mode==="Crédit"?"(obligatoire)":"(facultatif)")+'</label><input id="cl" list="cl2" value="'+esc(client)+'" oninput="client=this.value"><datalist id="cl2">'+clientNames()+'</datalist><label>Téléphone du client (facultatif, pour envoyer le reçu)</label><input inputmode="tel" value="'+esc(tel)+'" oninput="tel=this.value">';
  if(mode==="Crédit")h+='<label>Montant payé maintenant (F, facultatif)</label><input inputmode="numeric" value="'+(paid||"")+'" onchange="paid=num(this.value)">';
  return h+'<button class="btn" onclick="validate()">Valider la vente</button>'+hist();
}
function cq(id,d){var p=prod(id),q=(cart[id]||0)+d;if(q<0)q=0;if(q>p.q){q=p.q}if(q===0)delete cart[id];else cart[id]=q;draw()}
function validate(){
  var ids=Object.keys(cart);
  if(!ids.length)return openM('<h2>Panier vide</h2><button class="btn" onclick="closeM()">OK</button>');
  if(mode==="Crédit"&&!client.trim())return openM('<h2>Nom du client requis</h2><p class="sub">Pour une vente à crédit, indiquez le nom du client.</p><button class="btn" onclick="closeM()">OK</button>');
  for(var i=0;i<ids.length;i++){if(cart[ids[i]]>prod(ids[i]).q)return openM('<h2>Stock insuffisant</h2><button class="btn" onclick="closeM()">OK</button>')}
  var l=ids.map(function(k){var p=prod(k);return{id:p.id,n:p.n,q:cart[k],pu:p.v,pa:p.a}});
  var gross=sum(l,function(x){return x.q*x.pu}),r=Math.min(rem,gross),total=gross-r;
  var v={id:nid(),date:today(),l:l,total:total,rem:r,mode:mode,client:client.trim(),ts:new Date().toISOString(),paye:mode==="Crédit"?Math.min(paid,total):total,tel:telN(tel)};
  l.forEach(function(x){var p=prod(x.id);p.q-=x.q;S.mvts.push({d:today(),n:p.n,delta:-x.q,r:"Vente"})});
  S.ventes.push(v);save();cart={};client="";rem=0;paid=0;tel="";draw();receipt(v);
}
function P(){return S.prof||{}}
function pinfo(){var p=P();return{tels:[p.tel1,p.tel2].filter(Boolean).join(" / "),loc:[p.adr,[p.ville,p.pays].filter(Boolean).join(", ")].filter(Boolean).join(" - "),ids:[p.ninea?"NINEA : "+p.ninea:"",p.rccm?"RCCM : "+p.rccm:""].filter(Boolean).join(" · ")}}
function verse(v){return v.paye+sum(S.remb.filter(function(r){return r.vid==v.id}),function(r){return r.m})}
function statut(v){if(v.annule)return"Annulée";var r=reste(v);return r<=0?"Payé":(verse(v)>0?"Partiellement payé":"Crédit")}
function rnum(v){return v.date.slice(0,4)+"-"+String(v.id).padStart(5,"0")}
function dlong(v){try{return new Date(v.date+"T12:00:00").toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long",year:"numeric"})}catch(e){return v.date}}
function heure(v){if(!v.ts)return"";try{return new Date(v.ts).toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"})}catch(e){return""}}
function ptel(t){var d=String(t||"").replace(/\D/g,"");if(!d)return"";return d.length===12&&d.indexOf("221")===0?"+221 "+d.slice(3,5)+" "+d.slice(5,8)+" "+d.slice(8,10)+" "+d.slice(10):"+"+d}
function rcptHTML(v,fm){
  var p=P(),n=pinfo(),a4=fm==="a4",t58=fm==="58";

  if(t58){h+='<hr>'+v.l.map(function(x){return '<div><b>'+esc(x.n)+'</b></div><div class="tot"><span>'+x.q+' x '+f(x.pu)+'</span><span>'+f(x.q*x.pu)+'</span></div>'}).join("")}

  h+='<hr>'+L("Sous-total",f(sub))+(v.rem?L("Remise","- "+f(v.rem)):"")+'<div class="tot big"><span>TOTAL À PAYER</span><span>'+f(v.total)+'</span></div>'+L("Montant versé",f(ver))+L("Reste à payer",f(Math.max(0,re)))+L("Paiement",esc(v.mode))+L("Statut","<b>"+statut(v)+"</b>");
  h+='<hr><div class="c"><b>Merci pour votre confiance et votre fidélité !</b><div>Nous restons à votre disposition pour toute question.</div>'+(p.pol?'<div style="margin-top:4px;font-size:.9em">'+esc(p.pol)+'</div>':"")+(n.tels?'<div style="margin-top:4px">Contact : '+esc(n.tels)+'</div>':"")+'</div>'+(a4?'<div class="sig">Signature et cachet de l’entreprise</div>':"")+'</div>';
  return h;

function rcptText(v){
  var p=P(),n=pinfo(),t=[];
  if(p.nom)t.push("*"+p.nom+"*");if(p.slg)t.push(p.slg);if(p.prop)t.push(p.prop);if(n.tels)t.push("Tél : "+n.tels);if(n.loc)t.push(n.loc);if(n.ids)t.push(n.ids);
  t.push("----------------","REÇU DE VENTE N° "+rnum(v),dlong(v)+(heure(v)?" à "+heure(v):""));
  if(v.client)t.push("Client : "+v.client);if(v.tel)t.push("Tél. client : "+ptel(v.tel));
  t.push("----------------");
  v.l.forEach(function(x){t.push(x.n+"\n  "+x.q+" x "+f(x.pu)+" = "+f(x.q*x.pu))});
  t.push("----------------","Sous-total : "+f(sum(v.l,function(x){return x.q*x.pu})));
  if(v.rem)t.push("Remise : -"+f(v.rem));
  t.push("*TOTAL À PAYER : "+f(v.total)+"*","Montant versé : "+f(verse(v)),"Reste à payer : "+f(Math.max(0,reste(v))),"Paiement : "+v.mode,"Statut : "+statut(v),"----------------","Merci pour votre confiance et votre fidélité !");
  return t.join("\n");
}
